[project]
name = "tocandira"
version = "0.1.0"
description = "Hive engine lab: tournament harness, position labeling and a learned evaluation, built on nokamute"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hive-tournament = "tocandira.tournament:main"
hive-label = "tocandira.label:main"

[dependency-groups]
dev = ["ruff>=0.9", "mypy>=1.14", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tocandira"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "D", "RUF", "PL"]
ignore = [
    "D203",    # one blank line before class docstring (conflicts with D211)
    "D213",    # summary on second line (conflicts with D212)
    "D105",    # docstrings on magic methods
    "D107",    # docstrings on __init__ (the class docstring covers it)
    "PLR2004", # magic numbers: statistics code is full of legitimate constants
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
strict = true
files = ["tocandira"]

[tool.pytest.ini_options]
testpaths = ["tests"]
